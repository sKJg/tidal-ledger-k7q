name: daily
on:
  schedule:
    - cron: '23 22,23 * * 1-5'
    - cron: '23 0,1,2,3,4,6,9,12 * * 2-6'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: fetch
        id: fetch
        continue-on-error: true
        run: python fetch_oi.py
      - name: commit
        run: |
          git config user.name "archive-bot"
          git config user.email "archive-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - name: report
        if: steps.fetch.outcome == 'failure'
        run: exit 1
